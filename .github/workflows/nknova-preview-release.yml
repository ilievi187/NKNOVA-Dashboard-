name: NKNOVA Preview Release Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/nknova-preview-release.yml
      - CHANGELOG.md
      - LICENSE
      - README.md
      - THIRD-PARTY-NOTICES.md
      - Nolvus.Api.Library.Installer/**
      - Nolvus.Browser/**
      - Nolvus.Components/**
      - Nolvus.Core/**
      - Nolvus.Core.Tests/**
      - Nolvus.Dashboard/**
      - Nolvus.Instance/**
      - Nolvus.NexusApi/**
      - Nolvus.Package/**
      - Nolvus.Package.Tests/**
      - Nolvus.Services/**
      - Nolvus.Services.Tests/**
      - Nolvus.StockGame/**
      - Nolvus.Updater/**
      - build.sh
      - docs/INSTALLATION.md
      - docs/RELEASING.md
      - docs/TROUBLESHOOTING.md
      - scripts/package-windows.ps1
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: nknova-preview-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-preview:
    name: Linux package and startup smoke
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up .NET 10 LTS
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Validate tag and project version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -oPm1 '(?<=<Version>)[^<]+' Nolvus.Dashboard/Nolvus.Dashboard.csproj)"
          if [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version ${version}." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Run full solution tests
        run: dotnet test "Nolvus Dashboard Linux.sln" --configuration Release
      - name: Run resolver tests
        run: dotnet test Nolvus.Core.Tests/Nolvus.Core.Tests.csproj --configuration Release
      - name: Install Linux Secret Service test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y dbus-daemon gnome-keyring libsecret-tools
      - name: Run service regressions in isolated Secret Service session
        run: bash scripts/run-services-regressions-linux.sh
      - name: Build Linux release archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Desktop" "$RUNNER_TEMP/nknova-linux-dist"
          bash ./build.sh
          source_archive="$HOME/Desktop/Binaries-${VERSION}.tar.gz"
          test -s "$source_archive"
          mv "$source_archive" "$RUNNER_TEMP/nknova-linux-dist/NKNOVA-Linux-${VERSION}.tar.gz"
          (
            cd "$RUNNER_TEMP/nknova-linux-dist"
            sha256sum "NKNOVA-Linux-${VERSION}.tar.gz" > "NKNOVA-Linux-${VERSION}.tar.gz.sha256"
          )
      - name: Validate Linux archive and smoke-test extracted UI
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/nknova-linux-dist/NKNOVA-Linux-${VERSION}.tar.gz"
          gzip -t "$artifact"
          tar -tzf "$artifact" > "$RUNNER_TEMP/nknova-linux-files.txt"
          if grep -E '(^/|(^|/)\.\.(/|$)|NolvusUpdater|NolvusLauncher\.exe|\.pdb$|\.esp$|\.esm$|\.bsa$|(^|/)SkyrimSE\.exe$)' "$RUNNER_TEMP/nknova-linux-files.txt"; then
            echo 'Unexpected unsafe path, updater, debug symbol, or game data in Linux archive.' >&2
            exit 1
          fi
          grep -Fx 'Nolvus/NolvusDashboard' "$RUNNER_TEMP/nknova-linux-files.txt"
          grep -Fx 'Nolvus/LICENSE' "$RUNNER_TEMP/nknova-linux-files.txt"
          grep -Fx 'Nolvus/THIRD-PARTY-NOTICES.md' "$RUNNER_TEMP/nknova-linux-files.txt"
          grep -Fx 'Nolvus/docs/INSTALLATION.md' "$RUNNER_TEMP/nknova-linux-files.txt"
          grep -Fx 'Nolvus/docs/CREDENTIALS.md' "$RUNNER_TEMP/nknova-linux-files.txt"
          mkdir -p "$RUNNER_TEMP/nknova-linux-extracted" "$RUNNER_TEMP/nknova-linux-home"
          tar -xzf "$artifact" -C "$RUNNER_TEMP/nknova-linux-extracted"
          (
            cd "$RUNNER_TEMP/nknova-linux-extracted"
            tar --sort=name --mtime='@315532800' --owner=0 --group=0 --numeric-owner --format=gnu -cf - Nolvus | gzip -n -9 > "$RUNNER_TEMP/nknova-linux-repro.tar.gz"
          )
          cmp "$artifact" "$RUNNER_TEMP/nknova-linux-repro.tar.gz"
          echo 'Linux archive reproducibility check passed.'
          app="$RUNNER_TEMP/nknova-linux-extracted/Nolvus/NolvusDashboard"
          test -x "$app"
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi
          export HOME="$RUNNER_TEMP/nknova-linux-home"
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_DATA_HOME="$HOME/.local/share"
          export XDG_CACHE_HOME="$HOME/.cache"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME"
          set +e
          xvfb-run -a timeout --signal=TERM --kill-after=5s 20s "$app" > "$RUNNER_TEMP/nknova-linux-startup.log" 2>&1
          result=$?
          set -e
          if [[ "$result" -ne 124 ]]; then
            cat "$RUNNER_TEMP/nknova-linux-startup.log" >&2
            echo "Dashboard did not remain open for the 20-second UI smoke interval (exit ${result})." >&2
            exit 1
          fi
          echo 'Linux extracted application remained running for the 20-second smoke interval.'
      - name: Upload verified Linux package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nknova-linux
          path: ${{ runner.temp }}/nknova-linux-dist/*
          if-no-files-found: error
          retention-days: 5

  windows-preview:
    name: Windows package and startup smoke
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up .NET 10 LTS
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Validate tag and project version
        id: version
        shell: pwsh
        run: |
          $projectText = Get-Content -LiteralPath 'Nolvus.Dashboard/Nolvus.Dashboard.csproj' -Raw
          $versionMatch = [regex]::Match($projectText, '<Version>([^<]+)</Version>')
          if (-not $versionMatch.Success) { throw 'Dashboard project version was not found.' }
          $version = $versionMatch.Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match project version $version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Run package tests
        run: dotnet test Nolvus.Package.Tests/Nolvus.Package.Tests.csproj --configuration Release
      - name: Run resolver tests
        run: dotnet test Nolvus.Core.Tests/Nolvus.Core.Tests.csproj --configuration Release
      - name: Run service regressions
        run: dotnet run --project Nolvus.Services.Tests/Nolvus.Services.Tests.csproj --configuration Release
      - name: Reject unsafe or mismatched Windows package versions
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'nknova-rejected-version'
          foreach ($case in @(
            @{ Version = '../escape'; Expected = 'Invalid package version' },
            @{ Version = '9.9.9'; Expected = 'does not match Dashboard project version' }
          )) {
            $rejected = $false
            try {
              & .\scripts\package-windows.ps1 -OutputDirectory $output -Version $case.Version
            }
            catch {
              if ($_.Exception.Message -notmatch $case.Expected) { throw }
              $rejected = $true
            }
            if (-not $rejected) { throw "Unsafe/mismatched version was accepted: $($case.Version)" }
          }
          if (Test-Path -LiteralPath $output) {
            throw 'Rejected versions unexpectedly created an output directory.'
          }
      - name: Publish, package, validate, and smoke-test extracted Windows UI
        shell: pwsh
        run: .\scripts\package-windows.ps1 -OutputDirectory "$env:RUNNER_TEMP\nknova-windows-dist" -Version "${{ steps.version.outputs.version }}"
      - name: Upload verified Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nknova-windows
          path: ${{ runner.temp }}\nknova-windows-dist\*
          if-no-files-found: error
          retention-days: 5

  create-draft-release:
    name: Create GitHub draft pre-release
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    needs:
      - linux-preview
      - windows-preview
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      checks: read
    steps:
      - name: Check out release candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Validate exact candidate version and unique draft
        id: candidate
        shell: bash
        env:
          TAG: v${{ needs.linux-preview.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(grep -oPm1 '(?<=<Version>)[^<]+' Nolvus.Dashboard/Nolvus.Dashboard.csproj)"
          [[ "$TAG" == "v${version}" ]] || exit 1
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists: skipping, never overwriting."
            echo 'create=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
              echo 'Tag exists without a release; refusing to retarget.' >&2
              exit 1
            fi
          elif [[ "$GITHUB_REF" != "refs/tags/$TAG" ]]; then
            echo 'Unexpected ref for release draft.' >&2
            exit 1
          fi
          echo 'create=true' >> "$GITHUB_OUTPUT"
      - name: Confirm successful security CodeQL on main release commit
        if: steps.candidate.outputs.create == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # On protected main pushes, GitHub exposes the language-specific
          # CodeQL checks, but not the aggregate "CodeQL" result shown on PRs.
          # Require all three actual security-analysis jobs on this exact SHA.
          required='["CodeQL (csharp)","CodeQL (actions)","CodeQL (rust)"]'
          for attempt in $(seq 1 60); do
            checks=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100")
            if jq -e '[.check_runs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")] | length > 0' <<< "$checks" >/dev/null; then
              echo 'One or more commit checks failed; no release draft.' >&2
              exit 1
            fi
            if jq -e --argjson required "$required" '.check_runs as $runs | all($required[]; . as $n | any($runs[]; .name == $n and .conclusion == "success"))' <<< "$checks" >/dev/null; then
              echo 'All required language-specific CodeQL checks succeeded on exact main release commit.'
              exit 0
            fi
            sleep 10
          done
          echo 'Security checks did not pass before the CI deadline; no release.' >&2
          exit 1
      - name: Download verified Linux package
        if: steps.candidate.outputs.create == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nknova-linux
          path: ${{ runner.temp }}/release-assets
      - name: Download verified Windows package
        if: steps.candidate.outputs.create == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nknova-windows
          path: ${{ runner.temp }}/release-assets
      - name: Verify package checksums and archive contents
        if: steps.candidate.outputs.create == 'true'
        shell: bash
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release-assets"
          version="$(grep -oPm1 '(?<=<Version>)[^<]+' Nolvus.Dashboard/Nolvus.Dashboard.csproj)"
          cd "$assets"
          sha256sum -c "NKNOVA-Linux-${version}.tar.gz.sha256"
          sha256sum -c "NKNOVA-Windows-${version}.zip.sha256"
          gzip -t "NKNOVA-Linux-${version}.tar.gz"
          tar -tzf "NKNOVA-Linux-${version}.tar.gz" > linux-files.txt
          unzip -t "NKNOVA-Windows-${version}.zip"
          unzip -Z1 "NKNOVA-Windows-${version}.zip" > windows-files.txt
          if grep -E '(^/|(^|/)\.\.(/|$)|NolvusUpdater|NolvusLauncher\.exe|\.pdb$|\.esp$|\.esm$|\.bsa$|(^|/)SkyrimSE\.exe$)' linux-files.txt windows-files.txt; then
            echo 'Release archive contains a risky path, updater, debug symbol, or game data.' >&2
            exit 1
          fi
          grep -Fx 'Nolvus/NolvusDashboard' linux-files.txt
          grep -Fx 'Nolvus/LICENSE' linux-files.txt
          grep -Fx 'Nolvus/THIRD-PARTY-NOTICES.md' linux-files.txt
          grep -Fx 'Nolvus/docs/INSTALLATION.md' linux-files.txt
          grep -Fx 'NolvusDashboard.exe' windows-files.txt
          grep -Fx 'LICENSE' windows-files.txt
          grep -Fx 'THIRD-PARTY-NOTICES.md' windows-files.txt
          grep -Fx 'docs/INSTALLATION.md' windows-files.txt
          cat "NKNOVA-Linux-${version}.tar.gz.sha256" "NKNOVA-Windows-${version}.zip.sha256" > SHA256SUMS.txt
      - name: Prepare transparent preview notes
        if: steps.candidate.outputs.create == 'true'
        shell: bash
        env:
          TAG: v${{ needs.linux-preview.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          project_version="$(grep -oPm1 '(?<=<Version>)[^<]+' Nolvus.Dashboard/Nolvus.Dashboard.csproj)"
          test "$version" = "$project_version"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Refusing to overwrite it." >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/preview-notes.md" <<EOF
          # NKNOVA $TAG, preview draft

          This is an unpublished preview draft for maintainer and invited tester review. It is not a stable release.

          ## Included
          - Linux x64 Avalonia dashboard package and Windows x64 dashboard package.
          - Linux and Windows package, resolver, and URL-redaction tests, plus extracted-application startup smoke tests.
          - SHA-256 checksum files are attached.

          ## Limitations and safety
          - A complete live Nolvus installation was not performed. Use a separate backed-up test installation and do not overwrite a valuable modlist.
          - Automatic upstream self-update is disabled. Install later NKNOVA packages manually.
          - ImageSharp 3.2.0 contains the vendor-maintained v3 security backports and is built under the original issued assembly-scoped Community license. Security maintenance for ImageSharp 3.x ends on 12 May 2027.
          - Newly saved credentials use authenticated AES-GCM with Windows user-scoped DPAPI or Linux Secret Service key storage. Legacy TripleDES-ECB values remain readable but are not silently migrated; users must explicitly re-enter and save old passwords. The legacy decrypt path has an unresolved CodeQL finding and needs review before any public release. No user credentials are included in this package.
          - .NET 10 runtime is required. Full Nolvus installation support on Windows has not been demonstrated.
          EOF
          printf '\n## Changelog\n\n' >> "$RUNNER_TEMP/preview-notes.md"
          tail -n +3 CHANGELOG.md >> "$RUNNER_TEMP/preview-notes.md"
      - name: Create a draft, unpublished pre-release
        if: steps.candidate.outputs.create == 'true'
        shell: bash
        env:
          TAG: v${{ needs.linux-preview.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release-assets"
          flags=(--repo "$GITHUB_REPOSITORY" --title "NKNOVA $TAG Preview" --notes-file "$RUNNER_TEMP/preview-notes.md" --draft --prerelease)
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            flags+=(--target "$GITHUB_SHA")
          else
            flags+=(--verify-tag)
          fi
          gh release create "$TAG" \
            "$assets/NKNOVA-Linux-${TAG#v}.tar.gz" \
            "$assets/NKNOVA-Linux-${TAG#v}.tar.gz.sha256" \
            "$assets/NKNOVA-Windows-${TAG#v}.zip" \
            "$assets/NKNOVA-Windows-${TAG#v}.zip.sha256" \
            "$assets/SHA256SUMS.txt" \
            "${flags[@]}"
          mkdir -p "$RUNNER_TEMP/release-download"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release-download"
          cd "$RUNNER_TEMP/release-download"
          sha256sum -c SHA256SUMS.txt
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,assets --jq '{url,isDraft,isPrerelease,assets:[.assets[].name]}'
