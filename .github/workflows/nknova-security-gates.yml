name: NKNOVA Security Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: read

concurrency:
  group: nknova-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-rust-source:
    name: Detect Rust sources
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      has-rust: ${{ steps.detect.outputs.has-rust }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect tracked Rust source
        id: detect
        shell: bash
        run: |
          if find . -type f -name '*.rs' -not -path './.git/*' -print -quit | grep -q .; then
            echo 'has-rust=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has-rust=false' >> "$GITHUB_OUTPUT"
          fi

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - csharp
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  codeql-rust:
    name: CodeQL (rust)
    needs: detect-rust-source
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    env:
      RUST_DETECTION_RESULT: ${{ needs.detect-rust-source.result }}
      HAS_RUST: ${{ needs.detect-rust-source.outputs.has-rust }}
    steps:
      - name: Fail if Rust source detection failed
        if: env.RUST_DETECTION_RESULT != 'success'
        run: exit 1
      - name: Report that Rust analysis is not applicable
        if: env.RUST_DETECTION_RESULT == 'success' && env.HAS_RUST != 'true'
        run: echo "No Rust source files are present; CodeQL Rust analysis is not applicable."
      - name: Check out source
        if: env.RUST_DETECTION_RESULT == 'success' && env.HAS_RUST == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL for Rust
        if: env.RUST_DETECTION_RESULT == 'success' && env.HAS_RUST == 'true'
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: rust
          build-mode: none
          queries: security-extended
      - name: Perform Rust CodeQL analysis
        if: env.RUST_DETECTION_RESULT == 'success' && env.HAS_RUST == 'true'
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:rust

  dependency-review:
    name: Dependency Manifest Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source and base history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require manual review for dependency or license manifest changes
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          base=$(git merge-base origin/main "$GITHUB_SHA")
          changed_paths=$(git diff --name-only "$base" "$GITHUB_SHA")
          needs_review=false

          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            case "$path" in
              *.csproj|*.props|*.targets)
                patch=$(git diff "$base" "$GITHUB_SHA" -- "$path")
                if grep -Eq '^[+-][^+-].*<(PackageReference|PackageVersion|PackageDownload)([[:space:]>])' <<<"$patch"; then
                  echo "Third-party package declarations changed in ${path}. Manual license/advisory review is required because this fork cannot use GitHub's Dependency Review API." >&2
                  needs_review=true
                fi
                ;;
              */packages.lock.json|packages.lock.json|*/packages.config|packages.config|*/Cargo.toml|Cargo.toml|*/Cargo.lock|Cargo.lock|NuGet.config|nuget.config|global.json)
                echo "Dependency lock/source configuration changed: ${path}. Manual license/advisory review is required because this fork cannot use GitHub's Dependency Review API." >&2
                needs_review=true
                ;;
            esac
          done <<<"$changed_paths"

          if [[ "$needs_review" == true ]]; then
            # Reviewed, narrowly scoped security backport. All other dependency
            # changes must still fail closed for independent manual review.
            reviewed_image_upgrade=false
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]] &&
               [[ -z "$(git diff --name-only "$base" "$GITHUB_SHA" -- .github/workflows/)" ]] &&
               git cat-file -e "$GITHUB_SHA:sixlabors.lic" 2>/dev/null &&
               git cat-file -e "$GITHUB_SHA:docs/SIXLABORS-LICENSE.md" 2>/dev/null; then
              mapfile -t expected < <(printf '%s\n' \
                Nolvus.Api.Library.Installer/Nolvus.Api.Installer.csproj \
                Nolvus.Components/Nolvus.Components.csproj \
                Nolvus.Core/Nolvus.Core.csproj \
                Nolvus.Dashboard/Nolvus.Dashboard.csproj \
                Nolvus.Package/Nolvus.Package.csproj \
                Nolvus.Services/Nolvus.Services.csproj | sort)
              # PR #33 has an exactly enumerated and reviewed set of ten files.
              # Any additional changed path fails closed, including lockfiles.
              mapfile -t actual < <(printf '%s\n' "$changed_paths" | sort)
              mapfile -t permitted < <(printf '%s\n' \
                Directory.Build.props \
                Nolvus.Api.Library.Installer/Nolvus.Api.Installer.csproj \
                Nolvus.Components/Nolvus.Components.csproj \
                Nolvus.Core/Nolvus.Core.csproj \
                Nolvus.Dashboard/Nolvus.Dashboard.csproj \
                Nolvus.Package/Nolvus.Package.csproj \
                Nolvus.Services/Nolvus.Services.csproj \
                README.md \
                docs/SIXLABORS-LICENSE.md \
                sixlabors.lic | sort)
              if [[ "${actual[*]}" == "${permitted[*]}" ]]; then
                reviewed_image_upgrade=true
                for path in "${expected[@]}"; do
                  diff=$(git diff --unified=0 "$base" "$GITHUB_SHA" -- "$path")
                  mapfile -t package_lines < <(printf '%s\n' "$diff" | grep -E '^[+-][^+-].*<(PackageReference|PackageVersion|PackageDownload)([[:space:]>])' || true)
                  if [[ "${#package_lines[@]}" -ne 2 ]] ||
                     [[ "${package_lines[0]}" != '-    <PackageReference Include="SixLabors.ImageSharp" Version="3.1.12" />' ]] ||
                     [[ "${package_lines[1]}" != '+    <PackageReference Include="SixLabors.ImageSharp" Version="3.2.0" />' ]]; then
                    reviewed_image_upgrade=false
                    break
                  fi
                done
                props_diff=$(git diff --unified=0 "$base" "$GITHUB_SHA" -- Directory.Build.props)
                if printf '%s\n' "$props_diff" | grep -Eq '^[+-][^+-].*<(PackageReference|PackageVersion|PackageDownload)([[:space:]>])'; then
                  reviewed_image_upgrade=false
                fi
                license_data=$(git show "$GITHUB_SHA:sixlabors.lic")
                if [[ "$license_data" != Id=ctm_01m60z2tgq281q060a74zxhx0c\;Kind=Community\;* ]] ||
                   [[ "$license_data" != *'ExpiryDateUtc=2028-01-26'* ]] ||
                   [[ "$license_data" != *'Key=Assembly:'* ]]; then
                  reviewed_image_upgrade=false
                fi
              fi
            fi
            if [[ "$reviewed_image_upgrade" != true ]]; then
              echo "Dependency manifest delta outside the specifically reviewed ImageSharp 3.1.12 -> 3.2.0 exemption. Independent review required." >&2
              exit 1
            fi
            echo "Reviewed ImageSharp 3.2.0 security backport: exactly six direct references and vendor-issued scoped license."
          else
            echo "No third-party dependency manifests changed; no new dependency license or advisory was introduced."
          fi
